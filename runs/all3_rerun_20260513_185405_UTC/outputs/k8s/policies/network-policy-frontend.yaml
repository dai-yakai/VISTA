apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
spec:
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: productcatalogservice
  - to:
    - podSelector:
        matchLabels:
          app: recommendationservice
  ingress:
  - {}
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  - Egress
